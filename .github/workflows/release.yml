name: Draft release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify tag matches Cargo version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$RELEASE_TAG" = "v$version"
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Rust target
        run: rustup target add "$TARGET"
      - name: Check formatting and lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Test release target
        run: cargo test --locked --target "$TARGET"
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      - name: Package binary
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/url-inspect" dist/url-inspect
          cp README.md LICENSE dist/
          tar -czf "url-inspect-$RELEASE_TAG-$TARGET.tar.gz" -C dist url-inspect README.md LICENSE
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: url-inspect-*.tar.gz
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Create source archive
        run: python3 scripts/source_archive.py
      - name: Create checksums
        working-directory: dist
        run: sha256sum url-inspect-*.tar.gz > SHA256SUMS
      - name: Create draft release for review
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --draft --generate-notes --title "url-inspect $RELEASE_TAG"
