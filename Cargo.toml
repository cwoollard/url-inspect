[package]
name = "url-inspect"
version = "0.1.2"
edition = "2024"
description = "Inspect HTTP headers, Content Security Policies and TLS certificates"
license = "MIT"
readme = "README.md"
keywords = ["csp", "security", "http", "tls", "cli"]
categories = ["command-line-utilities", "web-programming::http-client"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "http2", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x509-parser = "0.18"

[profile.release]
lto = "thin"
strip = true
